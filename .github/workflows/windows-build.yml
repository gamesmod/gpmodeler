name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # Compiler cache, so only the files that changed are recompiled (saved even if the build fails)
      - name: Restore the ccache cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # release: false -> uses the preinstalled MSYS2 in C:\msys64,
      # which is the path hardcoded in BuildConfs.cmake for clang
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-ccache
            zip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPGM_PREFIX="$PWD/dist/gpmodeler"

      - name: Build
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_MAXSIZE=500M
          cmake --build build --parallel
          ccache -s

      - name: Save the ccache cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}

      - name: Install
        run: cmake --install build

      - name: Deploy Qt and runtime DLLs
        run: |
          cd dist/gpmodeler
          windeployqt6 --no-translations --no-system-d3d-compiler --no-opengl-sw gpmodeler.exe

      # libpq is the only database driver gpModeler uses (Greenplum and Cloudberry speak
      # the PostgreSQL protocol). It is bundled explicitly, together with the whole
      # transitive set of its runtime dependencies (OpenSSL, libintl, ICU, ...)
      - name: Bundle libpq and dependencies
        run: |
          cd dist/gpmodeler
          cp "$MSYSTEM_PREFIX/bin/libpq.dll" .
          # The shell runs with pipefail, so grep finding nothing must not fail the step
          for pass in 1 2 3 4 5; do
            for f in *.exe *.dll; do
              (ldd "$f" || true) | (grep -i '/mingw64/' || true) | awk '{print $3}' | xargs -r -I{} cp -n {} .
            done
          done

      - name: Verify the bundle is self-contained
        run: |
          cd dist/gpmodeler
          test -f libpq.dll
          missing=0
          # Resolving with a PATH limited to the Windows system dirs, so DLLs that are
          # only found in the MSYS2 tree (and would be missing on a clean machine) show up
          for f in *.exe *.dll platforms/*.dll; do
            if (env PATH=/c/Windows/system32:/c/Windows /usr/bin/ldd "$f" 2>/dev/null || true) | grep -i "not found"; then
              echo "::error::unresolved dependency in $f"
              missing=1
            fi
          done
          exit $missing

      - name: Pack
        run: |
          cd dist
          zip -qr "../gpmodeler-win64.zip" gpmodeler

      - uses: actions/upload-artifact@v4
        with:
          name: gpmodeler-win64
          path: gpmodeler-win64.zip

  # On version tags (v*) the zip from the build job is published as a GitHub release.
  # Write access is granted to this job only, the build itself runs read-only
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpmodeler-win64

      - name: Name the asset after the tag
        run: |
          asset="gpmodeler-${GITHUB_REF_NAME}-win64.zip"
          mv gpmodeler-win64.zip "$asset"
          sha256sum "$asset" > "$asset.sha256"

      # Tags with a suffix (v2.0-beta1, v2.0-rc1) are marked as pre-releases
      - uses: softprops/action-gh-release@v2
        with:
          name: gpModeler ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            gpmodeler-${{ github.ref_name }}-win64.zip
            gpmodeler-${{ github.ref_name }}-win64.zip.sha256
