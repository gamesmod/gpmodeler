<theme name="Dark">
    <description>
        <![CDATA[
            Dark color scheme for UI components based on the Apache Cloudberry brand palette (Berry Orange, Berry Yellow, black).
        ]]>
    </description>

    <!-- General UI colors, based on QPalette -->
    <palette role="light" active="#4f4a46" inactive="#4f4a46" disabled="#3a3633"/>
    <palette role="midlight" active="#45403c" inactive="#45403c" disabled="#33302d"/>
    <palette role="mid" active="#3f3a37" inactive="#3f3a37" disabled="#2d2a28"/>
    <palette role="button" active="#3a3532" inactive="#3a3532" disabled="#262321"/>
    <palette role="dark" active="#2d2a28" inactive="#2d2a28" disabled="#201e1c"/>
    <palette role="base" active="#161413" inactive="#161413" disabled="#161413"/>
    <palette role="window" active="#1a1817" inactive="#1a1817" disabled="#1a1817"/>
    <palette role="shadow" active="#000000" inactive="#000000" disabled="#000000"/>
    <palette role="text" active="#e8e6e3" inactive="#d6d3cf" disabled="#625b55"/>
    <palette role="bright-text" active="#f1f1f1" inactive="#f1f1f1" disabled="#f1f1f1"/>
    <palette role="button-text" active="#e8e6e3" inactive="#d6d3cf" disabled="#625b55"/>
    <palette role="window-text" active="#e8e6e3" inactive="#d6d3cf" disabled="#625b55"/>
    <palette role="highlight" active="#c44700" inactive="#c44700" disabled="#7a2e00"/>
    <palette role="highlighted-text" active="#ffffff" inactive="#ffffff" disabled="#1a1817"/>
    <palette role="accent" active="#ff7a1a" inactive="#ff7a1a" disabled="#e0650a"/>
    <palette role="link" active="#ff9a2f" inactive="#ff9a2f" disabled="#ff9a2f"/>
    <palette role="link-visited" active="#b08a6a" inactive="#b08a6a" disabled="#b08a6a"/>
    <palette role="alternate-base" active="#1f1c1a" inactive="#1f1c1a" disabled="#141210"/>
    <palette role="tool-tip-base" active="#3f3a37" inactive="#3f3a37" disabled="#3f3a37"/>
    <palette role="tool-tip-text" active="#e8e6e3" inactive="#e8e6e3" disabled="#e8e6e3"/>
    <palette role="placeholder-text" active="#3a3c3e" inactive="#3a3c3e" disabled="#3a3c3e"/>

    <!-- Table item colors -->
    <palette role="prot-item" bg-color="#b54225" fg-color="#fff"/>
    <palette role="rel-added-item" bg-color="#54a800" fg-color="#fff"/>
    <palette role="added-item" bg-color="#54a800" fg-color="#fff"/>
    <palette role="updated-item" bg-color="#e2e236" fg-color="#000"/>
    <palette role="removed-item" bg-color="#b54225" fg-color="#fff"/>
    <palette role="prot-item-alt" fg-color="#fa0000"/>
    <palette role="rel-added-item-alt" fg-color="#00f000"/>
</theme>
