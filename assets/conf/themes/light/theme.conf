<theme name="Light">
    <description>
        <![CDATA[
            Light color scheme for UI components based on the Apache Cloudberry brand palette (Berry Orange, Berry Yellow, white).
        ]]>
    </description>

    <!-- General UI colors, based on QPalette -->
    <palette role="light" active="#ebe9e7" inactive="#ebe9e7" disabled="#e0dedc"/>
    <palette role="midlight" active="#dddad7" inactive="#dddad7" disabled="#d3d0cd"/>
    <palette role="mid" active="#cfccc9" inactive="#cfccc9" disabled="#c5c2bf"/>
    <palette role="button" active="#f2f0ee" inactive="#f2f0ee" disabled="#e6e4e2"/>
    <palette role="dark" active="#c2bebb" inactive="#c2bebb" disabled="#b8b4b1"/>
    <palette role="base" active="#ffffff" inactive="#ffffff" disabled="#f5f4f2"/>
    <palette role="window" active="#f5f4f2" inactive="#f5f4f2" disabled="#f5f4f2"/>
    <palette role="shadow" active="#767676" inactive="#767676" disabled="#b1b1b1"/>
    <palette role="text" active="#232627" inactive="#232627" disabled="#777878"/>
    <palette role="bright-text" active="#ffffff" inactive="#ffffff" disabled="#ffffff"/>
    <palette role="button-text" active="#232627" inactive="#232627" disabled="#777878"/>
    <palette role="window-text" active="#232627" inactive="#232627" disabled="#777878"/>
    <palette role="highlight" active="#ffc08f" inactive="#ffc08f" disabled="#f5b888"/>
    <palette role="accent" active="#ff5900" inactive="#ff5900" disabled="#f07a3a"/>
    <palette role="highlighted-text" active="#1a1817" inactive="#1a1817" disabled="#5a524c"/>
    <palette role="link" active="#c24100" inactive="#c24100" disabled="#c24100"/>
    <palette role="link-visited" active="#7f8c8d" inactive="#7f8c8d" disabled="#7f8c8d"/>
    <palette role="alternate-base" active="#f5f4f2" inactive="#f5f4f2" disabled="#f5f4f2"/>
    <palette role="tool-tip-base" active="#ebe9e7" inactive="#ebe9e7" disabled="#ebe9e7"/>
    <palette role="tool-tip-text" active="#232627" inactive="#232627" disabled="#232627"/>
    <palette role="placeholder-text" active="#000000" inactive="#000000" disabled="#000000"/>

    <!-- Table item colors -->
    <palette role="prot-item" bg-color="#ffb4b4" fg-color="#303030"/>
    <palette role="rel-added-item" bg-color="#a4f9b0" fg-color="#303030"/>
    <palette role="added-item" bg-color="#c0ffc0" fg-color="#000"/>
    <palette role="updated-item" bg-color="#ffffc0" fg-color="#000"/>
    <palette role="removed-item" bg-color="#ffc0c0" fg-color="#000"/>
    <palette role="prot-item-alt" fg-color="#fa0000"/>
    <palette role="rel-added-item-alt" fg-color="#00f000"/>
</theme>
